<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chat Stream Test</title>
</head>
<body style="font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px;">

  <h2>Minimal Chat Stream Test</h2>

  <!-- 1. The Output Area -->
  <div id="messages" style="border: 1px solid #ccc; height: 350px; overflow-y: auto; padding: 12px; margin-bottom: 12px; white-space: pre-wrap;"></div>

  <!-- 2. The Input Form -->
  <form id="chat-form" style="display: flex; gap: 8px;">
    <input 
      type="text" 
      id="chat-input" 
      placeholder="Type a message..." 
      autocomplete="off" 
      required 
      style="flex: 1; padding: 8px;"
    />
    <button type="submit" id="send-btn" style="padding: 8px 16px;">Send</button>
  </form>

  <!-- 3. The Stream Reader Script -->
  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const messages = document.getElementById('messages');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      // Disable inputs during inference
      input.value = '';
      input.disabled = true;
      sendBtn.disabled = true;

      // Append user line
      appendLine('User: ' + text);

      // Create an empty AI line that we will append tokens to
      const botSpan = appendLine('AI: ');

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userMessage: text })
        });

        if (!response.ok) {
          throw new Error('Server returned HTTP ' + response.status);
        }

        // Read the streaming chunks
        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n');

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const raw = line.slice(6).trim();
              if (raw === '[DONE]') break;
              try {
                const data = JSON.parse(raw);
                if (data.response) {
                  botSpan.textContent += data.response;
                  messages.scrollTop = messages.scrollHeight;
                }
              } catch (_) {}
            }
          }
        }
      } catch (err) {
        botSpan.textContent += '[Error: ' + err.message + ']';
      } finally {
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
      }
    });

    function appendLine(text) {
      const p = document.createElement('div');
      p.style.marginBottom = '8px';
      const span = document.createElement('span');
      span.textContent = text;
      p.appendChild(span);
      messages.appendChild(p);
      messages.scrollTop = messages.scrollHeight;
      return span;
    }
  </script>
</body>
</html>
